<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lever Job Application Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    .asterisk { color: red; }
    #application_confirmation { display: none; padding: 20px; background: #e6ffed; border: 1px solid #34d058; }
  </style>
</head>
<body>
  <h1>Apply for Lead Software Engineer at Lever Partner Corp</h1>

  <form id="application_form" action="/apply" method="POST" enctype="multipart/form-data" onsubmit="event.preventDefault(); document.getElementById('application_form').style.display='none'; document.getElementById('application_confirmation').style.display='block';">
    <div class="field">
      <label for="name">Full Name <span class="asterisk">*</span></label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>

    <div class="field">
      <label for="email">Email <span class="asterisk">*</span></label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="phone">Phone <span class="asterisk">*</span></label>
      <input type="tel" id="phone" name="phone" required autocomplete="tel">
    </div>

    <div class="field">
      <label for="org">Current Company</label>
      <input type="text" id="org" name="org">
    </div>

    <div class="field">
      <label for="urls_linkedin">LinkedIn URL</label>
      <input type="url" id="urls_linkedin" name="urls[LinkedIn]">
    </div>

    <div class="field">
      <label for="urls_portfolio">Portfolio URL</label>
      <input type="url" id="urls_portfolio" name="urls[Portfolio]">
    </div>

    <div class="field">
      <label for="resume">Resume/CV <span class="asterisk">*</span></label>
      <input type="file" id="resume" name="resume" required>
    </div>

    <div class="field">
      <label for="comments">Additional Information / Cover Letter</label>
      <textarea id="comments" name="comments" rows="4"></textarea>
    </div>

    <div class="field">
      <label for="work_auth">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
      <select id="work_auth" name="cards[work_authorization]" required>
        <option value="">-- Please Select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="field">
      <label for="gender">Gender (Voluntary Self-Identification)</label>
      <select id="gender" name="cards[gender]">
        <option value="">-- Select --</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Non-Binary">Non-Binary</option>
        <option value="Decline to self-identify">Decline to self-identify</option>
      </select>
    </div>

    <div class="field" style="margin-top: 20px;">
      <button type="submit" id="btn-submit" data-qa="btn-submit" class="template-btn-submit">Submit application</button>
    </div>
  </form>

  <div id="application_confirmation" class="application-confirmation">
    <h2>Thank you for applying to Lever Partner Corp.</h2>
    <p>Your application has been received successfully.</p>
  </div>
</body>
</html>
