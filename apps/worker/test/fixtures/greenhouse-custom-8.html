<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Test Job Application - 8 Custom Questions</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    .asterisk { color: red; }
    #application_confirmation { display: none; padding: 20px; background: #e6ffed; border: 1px solid #34d058; }
  </style>
</head>
<body>
  <h1>Apply for Staff Software Engineer at Acme Corp</h1>

  <form id="application_form" action="/apply" method="POST" enctype="multipart/form-data" onsubmit="event.preventDefault(); document.getElementById('application_form').style.display='none'; document.getElementById('application_confirmation').style.display='block';">
    <!-- Standard Fields -->
    <div class="field">
      <label for="first_name">First Name <span class="asterisk">*</span></label>
      <input type="text" id="first_name" name="job_application[first_name]" required autocomplete="given-name">
    </div>

    <div class="field">
      <label for="last_name">Last Name <span class="asterisk">*</span></label>
      <input type="text" id="last_name" name="job_application[last_name]" required autocomplete="family-name">
    </div>

    <div class="field">
      <label for="email">Email <span class="asterisk">*</span></label>
      <input type="email" id="email" name="job_application[email]" required autocomplete="email">
    </div>

    <div class="field">
      <label for="phone">Phone <span class="asterisk">*</span></label>
      <input type="tel" id="phone" name="job_application[phone]" required autocomplete="tel">
    </div>

    <div class="field">
      <label for="resume">Resume/CV <span class="asterisk">*</span></label>
      <input type="file" id="resume" name="job_application[resume]" required>
    </div>

    <!-- 8 Custom Questions: -->
    <!-- 1. Legal / Dropdown: Work authorization (from profile) -->
    <div class="field">
      <label for="custom_q1">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
      <select id="custom_q1" name="job_application[answers_attributes][0][text_value]" required>
        <option value="">-- Please select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <!-- 2. Legal / Dropdown: Visa sponsorship (from profile) -->
    <div class="field">
      <label for="custom_q2">Will you now or in the future require visa sponsorship? <span class="asterisk">*</span></label>
      <select id="custom_q2" name="job_application[answers_attributes][1][text_value]" required>
        <option value="">-- Please select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <!-- 3. Legal / Dropdown: Criminal record (never goes to AI; unbanked -> asks user) -->
    <div class="field">
      <label for="custom_q3">Have you ever been convicted of a criminal felony? <span class="asterisk">*</span></label>
      <select id="custom_q3" name="job_application[answers_attributes][2][text_value]" required>
        <option value="">-- Please select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <!-- 4. Legal / Dropdown: Veteran status (from answers bank) -->
    <div class="field">
      <label for="custom_q4">What is your military veteran status? <span class="asterisk">*</span></label>
      <select id="custom_q4" name="job_application[answers_attributes][3][text_value]" required>
        <option value="">-- Please select --</option>
        <option value="Decline to self-identify">Decline to self-identify</option>
        <option value="I am not a protected veteran">I am not a protected veteran</option>
        <option value="I identify as a protected veteran">I identify as a protected veteran</option>
      </select>
    </div>

    <!-- 5. Technical / Text: TypeScript experience (answered from resume facts via AI) -->
    <div class="field">
      <label for="custom_q5">How many years of professional TypeScript experience do you have? <span class="asterisk">*</span></label>
      <input type="text" id="custom_q5" name="job_application[answers_attributes][4][text_value]" required>
    </div>

    <!-- 6. Dropdown / Preferences: Preferred work style (from profile preferences) -->
    <div class="field">
      <label for="custom_q6">What is your preferred work style arrangement? <span class="asterisk">*</span></label>
      <select id="custom_q6" name="job_application[answers_attributes][5][text_value]" required>
        <option value="">-- Please select --</option>
        <option value="Remote">Remote</option>
        <option value="Hybrid">Hybrid</option>
        <option value="In-office">In-office</option>
      </select>
    </div>

    <!-- 7. Text / Links: Portfolio or GitHub URL (from profile links) -->
    <div class="field">
      <label for="custom_q7">What is your personal portfolio or GitHub URL? <span class="asterisk">*</span></label>
      <input type="text" id="custom_q7" name="job_application[answers_attributes][6][text_value]" required>
    </div>

    <!-- 8. Unknown / Yes-No: Obscure question with no facts (AI confidence < 0.8 -> asks user) -->
    <div class="field">
      <label for="custom_q8">Have you ever operated an orbital particle accelerator? <span class="asterisk">*</span></label>
      <select id="custom_q8" name="job_application[answers_attributes][7][text_value]" required>
        <option value="">-- Please select --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="field">
      <input type="submit" id="submit_app" value="Submit Application">
    </div>
  </form>

  <div id="application_confirmation">
    <h2>Thank you for applying!</h2>
    <p>Your application has been received successfully.</p>
  </div>
</body>
</html>
